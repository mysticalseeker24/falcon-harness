name: CI

# Typecheck + the automated test suites for both workspaces must pass before merge. bench is not run
# here (it needs network + an OpenRouter key); it is the separate, measured headline harness.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  attesta-mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: attesta-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: attesta-mcp/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
